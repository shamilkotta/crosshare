name: Android release

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/android.yml"
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the nightly release"
        required: false
        default: true
        type: boolean

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
      asset: ${{ steps.meta.outputs.asset }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - id: meta
        name: Resolve version
        env:
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          publish=true
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$INPUT_PUBLISH" != "true" ]]; then
            publish=false
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#android-v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag must look like android-v1.2.3, got $GITHUB_REF_NAME"
              exit 1
            fi
            channel=stable tag="$GITHUB_REF_NAME" name="Crosshare" asset="Crosshare-$version-android"
          else
            base="$(jq -r .expo.version apps/mobile/app.json)"
            version="$base-nightly.$(date -u +%Y%m%d).${GITHUB_SHA::7}"
            channel=nightly tag=android-nightly name="Crosshare (Nightly)" asset="Crosshare-nightly-android"
          fi
          {
            echo "channel=$channel"
            echo "version=$version"
            echo "tag=$tag"
            echo "name=$name"
            echo "asset=$asset"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "$name $version (code $GITHUB_RUN_NUMBER), publish: $publish"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Decode upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
        run: |
          if [[ -z "$ANDROID_UPLOAD_KEYSTORE" ]]; then
            echo "::error::Set the ANDROID_UPLOAD_KEYSTORE, ANDROID_UPLOAD_STORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS and ANDROID_UPLOAD_KEY_PASSWORD secrets."
            exit 1
          fi
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build
        working-directory: apps/mobile/android
        env:
          CHANNEL: ${{ steps.meta.outputs.channel }}
          VERSION_NAME: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon \
            "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" \
            "-Pcrosshare.channel=$CHANNEL" \
            "-Pcrosshare.versionName=$VERSION_NAME" \
            "-Pcrosshare.versionCode=$VERSION_CODE" \
            "-Pcrosshare.upload.storeFile=$RUNNER_TEMP/upload.jks" \
            "-Pcrosshare.upload.storePassword=$STORE_PASSWORD" \
            "-Pcrosshare.upload.keyAlias=$KEY_ALIAS" \
            "-Pcrosshare.upload.keyPassword=$KEY_PASSWORD"

      - name: Collect outputs
        env:
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          mkdir -p out
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "out/$ASSET.apk"
          cp apps/mobile/android/app/build/outputs/bundle/release/app-release.aab "out/$ASSET.aab"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.asset }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ needs.build.outputs.channel }}
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
      APP_NAME: ${{ needs.build.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.asset }}
          path: release-assets

      - name: Publish stable release
        if: env.CHANNEL == 'stable'
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          notes="$(git tag -l --format='%(contents)' "$TAG")"
          gh release create "$TAG" release-assets/* \
            --title "$APP_NAME for Android $VERSION" \
            --notes "${notes:-Crosshare for Android $VERSION}" \
            --latest=false --verify-tag

      - name: Replace the nightly release
        if: env.CHANNEL == 'nightly'
        run: |
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" release-assets/* \
            --title "$APP_NAME for Android $VERSION" \
            --notes "Built from \`${GITHUB_SHA::7}\`. Unstable; for testing only." \
            --prerelease --latest=false --verify-tag
